<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <meta
      name="description"
      content="Traduce texto a código Morse y código Morse a texto fácilmente."
    >
    <title>Traductor Morse | Señal</title>
  </head>
  <body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <div class="row justify-content-center w-100">
        <section class="col-12 col-md-8 col-lg-6" aria-labelledby="pageTitle">
          <div class="card translator-card shadow">
            <div class="card-header bg-danger text-white text-center py-3">
              <h1 class="h3 mb-0" id="pageTitle">Traductor de código Morse</h1>
            </div>

            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label" for="TipoConversion">Tipo de conversión</label>
                <select class="form-select" id="TipoConversion">
                  <option value="textoAMorse">Texto normal a Morse</option>
                  <option value="morseATexto">Morse a texto normal</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label" for="input">Texto para procesar</label>
                <textarea
                  class="form-control"
                  id="input"
                  rows="4"
                  placeholder="Escribe un texto o código Morse"
                ></textarea>
                <div class="form-text" id="inputAyudaTexto">
                  En Morse, separa las letras con espacios y las palabras con /.
                </div>
              </div>

              <div class="d-flex gap-2 mb-3">
                <button class="btn btn-danger" id="procesarBoton" type="button">Procesar</button>
                <button class="btn btn-outline-danger" id="limpiarBoton" type="button">Limpiar</button>
              </div>

              <div class="alert alert-danger py-2" id="mensajeError" role="alert" hidden></div>

              <div>
                <label class="form-label" for="salida">Resultado</label>
                <textarea
                  class="form-control"
                  id="salida"
                  rows="4"
                  readonly
                  placeholder="El resultado aparecerá aquí"
                  aria-live="polite"
                ></textarea>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
